name: Build and publish applicationo on Staging

on:
  push:
    branches:
      - main

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    environment: The-project

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right image
        working-directory: ./overlays/staging
        run: |-
          kustomize edit set image PROJECT/IMAGE_FRONTEND=levonml/4-10-the-project-staging:$GITHUB_SHA
          kustomize edit set image PROJECT/IMAGE_BACKEND=levonml/4-10-todo-backend-staging:$GITHUB_SHA
      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: 'overlays/staging/kustomization.yaml'
          message: New staging version released ${{ github.sha }}