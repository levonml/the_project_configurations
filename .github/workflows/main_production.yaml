name: Build and publish application on Production

on:
  push:
    tags:
      - '*'

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    environment: The-project

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right image
        working-directory: ./overlays/production
        run: |-
          kustomize edit set image PROJECT/IMAGE_FRONTEND=levonml/4-10-the-project:$GITHUB_SHA
          kustomize edit set image PROJECT/IMAGE_BACKEND=levonml/4-10-todo-backend:$GITHUB_SHA
          kustomize edit set image PROJECT/IMAGE_BROADCASTER=levonml/4-10-broadcaster:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: 'overlays/production/kustomization.yaml'
          message: New production version released ${{ github.sha }}